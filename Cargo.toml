[package]
name = "stardist-rs"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "Rust translation of StarDist object detection with star-convex shapes"
repository = "https://github.com/henriksson-lab/stardist-rs"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/LICENSE.txt",
    "/README.md",
    "/src/**",
    "/examples/**",
    "/assets/models/examples/2D_demo/config.json",
    "/assets/models/examples/2D_demo/thresholds.json",
    "/assets/models/examples/3D_demo/config.json",
    "/assets/models/examples/3D_demo/thresholds.json",
    "/assets/data/images/histo.jpg",
    "/assets/data/images/img2d.tif",
    "/assets/data/images/img3d.tif",
    "/assets/data/images/mask2d.tif",
    "/assets/data/images/mask3d.tif",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hdf5 = { package = "hdf5-pure-rust", version = "0.3.10", default-features = false, optional = true }
ndarray = "0.16"
ndarray-npy = "=0.9.1"
geo-clipper-pure-rs = { git = "https://github.com/henriksson-lab/geo-clipper-pure-rs.git" }
zip = { version = "2.4.2", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
tiff = "0.11.3"

[features]
default = ["burn", "hdf5"]
hdf5 = ["dep:hdf5"]
burn = ["dep:burn"]
burn-wgpu = ["burn", "burn/wgpu"]
candle = ["dep:candle-core", "dep:candle-nn"]
candle-cuda = ["candle", "candle-core/cuda", "candle-nn/cuda"]
candle-cudnn = ["candle-cuda", "candle-core/cudnn", "candle-nn/cudnn"]
candle-metal = ["candle", "candle-core/metal", "candle-nn/metal"]
cli = []

[dependencies.burn]
version = "0.21"
default-features = false
features = ["std", "train", "autodiff", "flex"]
optional = true

[dependencies.candle-core]
version = "0.11"
optional = true

[dependencies.candle-nn]
version = "0.11"
optional = true

[dev-dependencies]
libc = "0.2"

[patch.crates-io]
candle-core = { git = "https://github.com/mahogny/candle.git", branch = "stardist-integration" }
candle-kernels = { git = "https://github.com/mahogny/candle.git", branch = "stardist-integration" }
candle-metal-kernels = { git = "https://github.com/mahogny/candle.git", branch = "stardist-integration" }
candle-nn = { git = "https://github.com/mahogny/candle.git", branch = "stardist-integration" }
